apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transactions-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /cardops(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: transactions-service
                port:
                  number: 80
