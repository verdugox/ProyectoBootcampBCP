apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transactions-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /transactions-service
            pathType: Prefix
            backend:
              service:
                name: transactions-service
                port:
                  number: 8085
