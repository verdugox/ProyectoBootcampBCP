apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transactions-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: transactions-service
                port:
                  number: 8085
